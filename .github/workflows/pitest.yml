name: Pitest

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  pitest:
    name: Run Pitest
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: ''
      MAVEN_OPTS: ''
      PITEST_THRESHOLD: '90'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Environment info
        run: |
          java -version
          mvn -v
          echo "JAVA_TOOL_OPTIONS='$JAVA_TOOL_OPTIONS' MAVEN_OPTS='$MAVEN_OPTS'"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Precheck: Pitest plugin version
        working-directory: 45_IntegrationHub
        run: |
          echo "PITEST threshold=${PITEST_THRESHOLD}"
          mvn -q -f pom.xml -DskipTests=true help:evaluate -Dexpression=pitest.version -DforceStdout || true

      - name: Run Pitest (clean JVM args)
        working-directory: 45_IntegrationHub
        run: |
          mvn -B -V -f 45_IntegrationHub/pom.xml -Dcheckstyle.skip=true -Denable.quality.enforcements=true -Dpitest.mutationThreshold=${{ env.PITEST_THRESHOLD }} verify
