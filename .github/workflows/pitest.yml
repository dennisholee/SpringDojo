name: Pitest

on:
  push:
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Pitest (clean JVM args)
        env:
          JAVA_TOOL_OPTIONS: ''
          MAVEN_OPTS: ''
        run: |
          mvn -B -V -Ppitest-ci -Dcheckstyle.skip=true -Denable.quality.enforcements=true verify
