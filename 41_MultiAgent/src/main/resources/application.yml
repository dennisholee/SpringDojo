spring:
    main:
        web-application-type: none
        allow-bean-definition-overriding: true
    ai:
        openai:
            # Redirect from api.openai.com to local LM Studio
            base-url: http://192.168.1.23:1234
            # LM Studio doesn't require a real key, but Spring AI needs a non-empty string
            api-key: lm-studio
            chat:
                options:
                    model: mistralai/ministral-3-3b # qwen/qwen3-8b
                    max-tokens: 30000
                    temperature: 0
        mcp:
            client:
                stdio:
                    connections:
                        # Name of the connection
                        filesystem-agent:
                            # In 2026, npx is the standard way to run the filesystem server
                            command: /opt/homebrew/bin/npx
                            args:
                                - "-y"
                                - "@modelcontextprotocol/server-filesystem"
                                # Specify the directories the agent is allowed to access
                                - "/Users/dennislee/Devs/SpringDojo/41_MultiAgent/src/main/resources/requirements"