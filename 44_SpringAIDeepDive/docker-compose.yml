services:
    chromadb:
        image: chromadb/chroma:1.4.2.dev151 # 0.5.20
        container_name: chromadb
        ports:
            - "8000:8000"
        environment:
            - IS_PERSISTENT=TRUE
            - ANONYMIZED_TELEMETRY=FALSE
        volumes:
            - chroma_data:/chroma/chroma
        restart: unless-stopped
        networks:
            - ai-network

networks:
    ai-network:
        driver: bridge

volumes:
    chroma_data: